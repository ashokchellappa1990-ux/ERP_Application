<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="Shopping cart sample">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
  </defs>
  <ellipse cx="110" cy="182" rx="86" ry="12" fill="#7c3aed" opacity="0.08"/>
  <!-- cart -->
  <path d="M28 40 h20 l18 92 h86 l16 -66 H70" fill="none" stroke="url(#c1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="150" r="12" fill="#6d28d9"/><circle cx="150" cy="150" r="12" fill="#6d28d9"/>
  <!-- goods -->
  <rect x="74" y="66" width="34" height="30" rx="4" fill="#f59e0b"/><rect x="74" y="76" width="34" height="4" fill="#fbbf24"/>
  <rect x="112" y="60" width="30" height="36" rx="4" fill="#22c55e"/><rect x="122" y="60" width="4" height="36" fill="#4ade80"/>
  <rect x="146" y="70" width="26" height="26" rx="4" fill="#3b82f6"/>
  <!-- discount tags -->
  <g transform="translate(150,26) rotate(12)"><rect width="40" height="26" rx="6" fill="url(#c2)"/><text x="20" y="18" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="800" fill="#fff">%</text></g>
  <g transform="translate(26,84) rotate(-10)"><rect width="34" height="22" rx="6" fill="#ec4899"/><text x="17" y="16" text-anchor="middle" font-family="Inter,Arial" font-size="11" font-weight="800" fill="#fff">50%</text></g>
  <circle cx="176" cy="112" r="14" fill="#7c3aed"/><path d="M170 112 l4 4 8 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
