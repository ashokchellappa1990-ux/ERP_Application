<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Retail store POS">
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#faf5ff"/></linearGradient>
    <linearGradient id="mon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="pur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  </defs>
  <rect width="600" height="560" fill="url(#bgs)"/>
  <!-- ceiling lights -->
  <g fill="#e9d5ff" opacity="0.7"><rect x="60" y="30" width="120" height="8" rx="4"/><rect x="240" y="24" width="120" height="8" rx="4"/><rect x="420" y="30" width="120" height="8" rx="4"/></g>
  <ellipse cx="300" cy="70" rx="360" ry="90" fill="#ffffff" opacity="0.6"/>
  <!-- shelves -->
  <g opacity="0.5" fill="#c4b5fd"><rect x="30" y="120" width="150" height="200" rx="8"/><rect x="420" y="120" width="150" height="200" rx="8"/></g>
  <g opacity="0.6"><circle cx="70" cy="170" r="12" fill="#f59e0b"/><circle cx="110" cy="170" r="12" fill="#22c55e"/><circle cx="150" cy="170" r="12" fill="#ef4444"/><circle cx="460" cy="180" r="12" fill="#3b82f6"/><circle cx="500" cy="180" r="12" fill="#ec4899"/><circle cx="540" cy="180" r="12" fill="#8b5cf6"/></g>
  <!-- counter -->
  <rect x="0" y="420" width="600" height="140" fill="#5b21b6" opacity="0.12"/>
  <rect x="40" y="410" width="520" height="26" rx="6" fill="#a78bfa" opacity="0.4"/>
  <!-- POS monitor -->
  <rect x="210" y="250" width="230" height="150" rx="10" fill="#1e1b39"/>
  <rect x="218" y="258" width="214" height="118" rx="6" fill="url(#mon)"/>
  <text x="232" y="284" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#1e1b39">Bill Summary</text>
  <g font-family="Inter,Arial" font-size="9" fill="#64748b">
    <text x="232" y="304">Rice 1kg</text><text x="410" y="304" text-anchor="end" fill="#1e1b39">₹65.00</text>
    <text x="232" y="320">Sunflower Oil 1L</text><text x="410" y="320" text-anchor="end" fill="#1e1b39">₹120.00</text>
    <text x="232" y="336">Toor Dal 1kg</text><text x="410" y="336" text-anchor="end" fill="#1e1b39">₹110.00</text>
  </g>
  <rect x="218" y="348" width="214" height="28" rx="0" fill="url(#pur)"/>
  <text x="232" y="366" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#fff">Total Payable</text>
  <text x="418" y="366" text-anchor="end" font-family="Inter,Arial" font-size="12" font-weight="800" fill="#fff">₹441.00</text>
  <rect x="300" y="400" width="50" height="10" fill="#1e1b39"/>
  <!-- scanner + receipt printer -->
  <rect x="80" y="360" width="90" height="60" rx="8" fill="#334155"/><rect x="92" y="372" width="66" height="26" rx="3" fill="#0f172a"/>
  <!-- plant -->
  <g transform="translate(470,360)"><rect x="0" y="30" width="40" height="34" rx="6" fill="#8b5cf6" opacity="0.5"/><path d="M20 30 Q0 0 8 -6 Q20 6 20 30 Q40 0 32 -6 Q20 6 20 30" fill="#22c55e" opacity="0.7"/></g>
</svg>
