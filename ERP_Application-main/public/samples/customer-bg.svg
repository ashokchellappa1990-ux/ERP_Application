<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Store background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="0.5" stop-color="#ede9fe"/><stop offset="1" stop-color="#faf5ff"/></linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.2" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/></linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <!-- ceiling light strips -->
  <g fill="#ffffff" opacity="0.7">
    <rect x="120" y="40" width="240" height="10" rx="5"/><rect x="480" y="30" width="240" height="10" rx="5"/><rect x="840" y="40" width="240" height="10" rx="5"/><rect x="1200" y="30" width="240" height="10" rx="5"/>
  </g>
  <ellipse cx="800" cy="120" rx="900" ry="180" fill="url(#light)"/>
  <!-- shelves (soft) -->
  <g opacity="0.55">
    <rect x="60" y="180" width="420" height="360" rx="14" fill="url(#shelf)"/>
    <rect x="1120" y="180" width="420" height="360" rx="14" fill="url(#shelf)"/>
    <g fill="#a78bfa" opacity="0.35">
      <rect x="90" y="220" width="360" height="18" rx="6"/><rect x="90" y="300" width="360" height="18" rx="6"/><rect x="90" y="380" width="360" height="18" rx="6"/><rect x="90" y="460" width="360" height="18" rx="6"/>
      <rect x="1150" y="220" width="360" height="18" rx="6"/><rect x="1150" y="300" width="360" height="18" rx="6"/><rect x="1150" y="380" width="360" height="18" rx="6"/><rect x="1150" y="460" width="360" height="18" rx="6"/>
    </g>
  </g>
  <!-- product bokeh -->
  <g opacity="0.5">
    <circle cx="150" cy="260" r="16" fill="#f59e0b"/><circle cx="230" cy="260" r="16" fill="#22c55e"/><circle cx="310" cy="260" r="16" fill="#ef4444"/>
    <circle cx="1200" cy="340" r="16" fill="#3b82f6"/><circle cx="1280" cy="340" r="16" fill="#ec4899"/><circle cx="1360" cy="340" r="16" fill="#8b5cf6"/>
  </g>
  <!-- best deals sign -->
  <g transform="translate(700,150)" opacity="0.5"><rect width="200" height="120" rx="12" fill="#7c3aed"/><text x="100" y="52" text-anchor="middle" font-family="Inter,Arial" font-size="26" font-weight="800" fill="#fff">BEST</text><text x="100" y="86" text-anchor="middle" font-family="Inter,Arial" font-size="26" font-weight="800" fill="#fff">DEALS</text></g>
</svg>
